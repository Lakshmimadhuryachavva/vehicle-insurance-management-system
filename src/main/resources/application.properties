spring.application.name=vehicle-insurance

# 1. Database Connection URL (ensure the database 'aims_db' is created in MySQL first)
spring.datasource.url=jdbc:mysql://localhost:3306/insurance_db

# 2. Database Credentials
spring.datasource.username=root
spring.datasource.password=root@123

# 3. Driver Class (Spring Boot 4 detects this, but explicit is safer)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 4. Hibernate / JPA Settings
spring.jpa.hibernate.ddl-auto=update
#spring.jpa.show-sql=true
server.port=9091
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect