<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>Edit Policy</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>

<div th:replace="fragments/customer-header :: header('policies')"></div>

<div class="container">
    <h1 class="page-title">Edit Policy</h1>
    <p class="subtext">Update coverage amount (premium recalculates automatically)</p>

    <div class="card">
        <div style="margin-bottom:12px;color:var(--muted);">
            Policy: <b th:text="${policy.policyNumber}">POL</b> |
            Vehicle: <b th:text="${policy.vehicle.make + ' ' + policy.vehicle.model + ' (' + policy.vehicle.registrationNumber + ')'}">Vehicle</b>
        </div>

        <form th:action="@{'/customer/policies/' + ${policy.policyId} + '/edit'}" method="post">
            <div class="form-row">
                <div>
                    <label style="font-weight:800;">Current Coverage</label>
                    <label>
                        <input th:value="${policy.coverageAmount}" disabled>
                    </label>
                </div>
                <div>
                    <label style="font-weight:800;">Current Premium</label>
                    <label>
                        <input th:value="${policy.premiumAmount}" disabled>
                    </label>
                </div>
            </div>

            <div style="margin-top:12px;">
                <label style="font-weight:800;">New Coverage Amount</label>
                <label>
                    <input name="coverageAmount" type="number" min="1000" step="100"
                           th:value="${policy.coverageAmount}" required>
                </label>
            </div>

            <div style="margin-top:14px;display:flex;gap:10px;">
                <button class="btn btn-primary" type="submit">Save</button>
                <a class="btn" th:href="@{/customer/policies}">Back</a>
            </div>
        </form>

        <div style="margin-top:10px;color:var(--muted);font-size:13px;">
            Note: Only coverage & premium are updated here. Policy period remains same.
        </div>
    </div>
</div>

</body>
</html>
