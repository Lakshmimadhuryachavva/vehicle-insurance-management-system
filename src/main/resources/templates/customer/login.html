<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>Customer Login - Vehicle Insurance</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="auth-wrap">

<div class="auth-card">
    <div class="auth-head">
        <img th:src="@{/images/logo.svg}" alt="logo" src=""/>
        <div>
            <h1 class="auth-title">Vehicle Insurance</h1>
            <div class="auth-sub">Customer Portal — login to manage policies and claims</div>
        </div>
    </div>

    <div th:if="${param.registered}" class="alert success" style="margin-bottom:12px;">
        Account created successfully. Please log in.
    </div>

    <div th:if="${param.logout}" class="alert success" style="margin-bottom:12px;">
        Logged out successfully.
    </div>

    <!-- ✅ Specific error: admin tried to login in customer portal -->
    <div th:if="${param.error != null and param.error[0] == 'onlyCustomer'}"
         class="alert error" style="margin-bottom:12px;">
        Admin cannot login in Customer Portal. Please use Admin Login.
    </div>

    <!-- ✅ Generic invalid credentials -->
    <div th:if="${param.error != null and param.error[0] == 'true'}"
         class="alert error" style="margin-bottom:12px;">
        Invalid email or password.
    </div>

    <form th:action="@{/customer/login}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div style="margin-bottom:12px;">
            <label style="font-weight:800;">Email</label>
            <label>
                <input name="username" type="email" placeholder="Enter your email" required>
            </label>
        </div>

        <div style="margin-bottom:14px;">
            <label style="font-weight:800;">Password</label>
            <label>
                <input name="password" type="password" placeholder="Enter your password" required>
            </label>
        </div>

        <button class="btn btn-primary" style="width:100%;justify-content:center;" type="submit">
            Login
        </button>
    </form>

    <div class="auth-footer">
        <div style="margin-top:10px;">
            New user?
            <a th:href="@{/customer/register}" style="color:var(--primary);font-weight:800;">Create account</a>
        </div>
        <div style="margin-top:10px;">
            Admin?
            <a th:href="@{/admin/login}" style="color:var(--primary);font-weight:800;">Admin Login</a>
        </div>
    </div>
</div>

</body>
</html>
