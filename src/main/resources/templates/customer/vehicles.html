<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>My Vehicles</title>

    <link rel="stylesheet" th:href="@{/css/app.css}"/>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>

<div th:replace="fragments/customer-header :: header('vehicles')"></div>

<div class="container">
    <h1 class="page-title">My Vehicles</h1>
    <p class="subtext">Manage your registered vehicles</p>

    <div th:if="${param.added}" class="alert success">Vehicle added successfully!</div>
    <div th:if="${param.updated}" class="alert success">Vehicle updated successfully!</div>

    <!-- ✅ Add Vehicle in same page (no script) -->
    <details class="card">
        <summary class="btn btn-primary">
            <i class="bi bi-plus-lg"></i> Add Vehicle
        </summary>

        <div style="margin-top:14px;">
            <form th:action="@{/customer/vehicles/add}"
                  th:object="${vehicle}"
                  method="post">

                <div class="form-row">
                    <div>
                        <label>Registration Number</label>
                        <input type="text"
                               th:field="*{registrationNumber}"
                               placeholder="e.g. ABC123"
                               required>
                        <small th:if="${#fields.hasErrors('registrationNumber')}"
                               th:errors="*{registrationNumber}"></small>
                    </div>

                    <div>
                        <label>Vehicle Type</label>
                        <select th:field="*{vehicleType}" required>
                            <option value="" disabled selected>Select type</option>
                            <option th:each="t : ${types}"
                                    th:value="${t}"
                                    th:text="${t}"></option>
                        </select>
                        <small th:if="${#fields.hasErrors('vehicleType')}"
                               th:errors="*{vehicleType}"></small>
                    </div>
                </div>

                <div class="form-row" style="margin-top:12px;">
                    <div>
                        <label>Make</label>
                        <input type="text"
                               th:field="*{make}"
                               required>
                        <small th:if="${#fields.hasErrors('make')}"
                               th:errors="*{make}"></small>
                    </div>

                    <div>
                        <label>Model</label>
                        <input type="text"
                               th:field="*{model}"
                               required>
                        <small th:if="${#fields.hasErrors('model')}"
                               th:errors="*{model}"></small>
                    </div>
                </div>

                <div style="margin-top:12px;">
                    <label>Year of Manufacture</label>
                    <input type="number"
                           min="1980"
                           max="2100"
                           th:field="*{yearOfManufacture}"
                           required>
                    <small th:if="${#fields.hasErrors('yearOfManufacture')}"
                           th:errors="*{yearOfManufacture}"></small>
                </div>

                <div style="margin-top:14px;">
                    <button class="btn btn-primary" type="submit">
                        Save
                    </button>
                </div>

            </form>
        </div>
    </details>

    <!-- ✅ Vehicle list -->
    <div class="card">
        <div style="font-weight:900;font-size:18px;margin-bottom:12px;">
            Vehicle List
        </div>

        <table class="table">
            <thead>
            <tr>
                <th>Registration</th>
                <th>Make</th>
                <th>Model</th>
                <th>Year</th>
                <th>Type</th>
                <th>Actions</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="v : ${vehicles}">
                <td th:text="${v.registrationNumber}"></td>
                <td th:text="${v.make}"></td>
                <td th:text="${v.model}"></td>
                <td th:text="${v.yearOfManufacture}"></td>

                <td>
                    <span class="badge vehicle-type"
                          th:text="${v.vehicleType}"
                          th:classappend="' ' + ${v.vehicleType.name().toLowerCase()}">
                    </span>
                </td>

                <td>
                    <a class="btn"
                       th:href="@{'/customer/vehicles/' + ${v.vehicleId} + '/edit'}">
                        <i class="bi bi-pencil"></i> Edit
                    </a>
                </td>
            </tr>

            <tr th:if="${#lists.isEmpty(vehicles)}">
                <td colspan="6" style="color:var(--muted);">
                    No vehicles added yet.
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
