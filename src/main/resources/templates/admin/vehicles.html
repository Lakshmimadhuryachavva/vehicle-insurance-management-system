<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>Vehicles - Admin</title>

    <link rel="stylesheet" th:href="@{/css/app.css}"/>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body class="admin-page">

<div th:replace="fragments/admin-header :: header('vehicles')"></div>

<div class="container">
    <h1 class="page-title">Vehicle Management</h1>
    <p class="subtext">View and manage all registered vehicles</p>

    <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
            <div style="font-weight:900;font-size:18px;">Vehicle List</div>
            <div style="color:var(--muted);font-size:13px;">
                Total: <b th:text="${#lists.size(vehicles)}">0</b>
            </div>
        </div>

        <table class="table">
            <thead>
            <tr>
                <th>Vehicle ID</th>
                <th>Registration</th>
                <th>Owner</th>
                <th>Make</th>
                <th>Model</th>
                <th>Year</th>
                <th>Type</th>
                <th>Created</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="v : ${vehicles}">
                <td th:text="${v.vehicleId}"></td>
                <td th:text="${v.registrationNumber}"></td>
                <td th:text="${v.customer.name}"></td>
                <td th:text="${v.make}"></td>
                <td th:text="${v.model}"></td>
                <td th:text="${v.yearOfManufacture}"></td>

                <td>
                    <span class="badge vehicle-type"
                          th:text="${v.vehicleType}"
                          th:classappend="' ' + ${v.vehicleType.name().toLowerCase()}">
                    </span>
                </td>

                <td th:text="${v.createdDate}"></td>
            </tr>

            <tr th:if="${#lists.isEmpty(vehicles)}">
                <td colspan="8" style="color:var(--muted);">
                    No vehicles found.
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
