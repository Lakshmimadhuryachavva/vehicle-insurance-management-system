<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>Admin Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>

<div th:replace="fragments/admin-header :: header('dash')"></div>

<div class="container">
    <h1 class="page-title">Dashboard Overview</h1>
    <p class="subtext">Welcome to the Vehicle Insurance Management System</p>

    <div class="grid-4">
        <div class="card stat stat-blue">
            <div>
                <div class="label">Total Customers</div>
                <div class="value" th:text="${totalCustomers}">0</div>
            </div>
        </div>

        <div class="card stat stat-green">
            <div>
                <div class="label">Total Vehicles</div>
                <div class="value" th:text="${totalVehicles}">0</div>
            </div>
        </div>

        <div class="card stat stat-yellow">
            <div>
                <div class="label">Total Policies</div>
                <div class="value" th:text="${totalPolicies}">0</div>
            </div>
        </div>

        <div class="card stat stat-grey">
            <div>
                <div class="label">Pending Claims</div>
                <div class="value" th:text="${pendingClaims}">0</div>
            </div>
        </div>
    </div>

    <div class="form-row" style="margin-top:18px;">
        <div class="card">
            <div style="font-weight:900;font-size:18px;margin-bottom:10px;">
                Claims Overview
            </div>

            <div class="form-row">
                <div class="card" style="background:#f8faff;">
                    <div style="color:var(--muted);">Approved Claims</div>
                    <div style="font-size:28px;font-weight:900;" th:text="${approvedClaims}">0</div>
                </div>
                <div class="card" style="background:#f8faff;">
                    <div style="color:var(--muted);">Pending Claims</div>
                    <div style="font-size:28px;font-weight:900;" th:text="${pendingClaims}">0</div>
                </div>
            </div>

            <div style="margin-top:12px;">
                <a class="btn btn-primary" th:href="@{/admin/approvals}">
                    Go to Approvals
                </a>
            </div>
        </div>

    </div>

</div>
</body>
</html>
