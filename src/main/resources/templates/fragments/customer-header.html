<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="header(active)">
    <div class="topbar">
        <div class="container">
            <div style="display:flex;justify-content:space-between;align-items:center;">
                <div class="brand">
                    <img th:src="@{/images/logo.svg}" alt="logo" src=""/>
                    <span>Vehicle Insurance</span>
                </div>
                <div style="display:flex;gap:12px;align-items:center;">
                    <div style="color:var(--muted);" th:text="'Welcome, ' + (${customerName} ?: 'Customer')">Welcome</div>
                    <form th:action="@{/logout}" method="post">
                        <button class="btn" type="submit"><i class="bi bi-box-arrow-right"></i> Logout</button>
                    </form>
                </div>
            </div>

            <nav class="nav">
                <a th:classappend="${active=='home'} ? 'active'" th:href="@{/customer/dashboard}">
                    <i class="bi bi-house"></i> Home
                </a>
                <a th:classappend="${active=='vehicles'} ? 'active'" th:href="@{/customer/vehicles}">
                    <i class="bi bi-car-front"></i> Vehicles
                </a>
                <a th:classappend="${active=='policies'} ? 'active'" th:href="@{/customer/policies}">
                    <i class="bi bi-file-earmark-text"></i> Policies
                </a>
                <a th:classappend="${active=='claims'} ? 'active'" th:href="@{/customer/claims}">
                    <i class="bi bi-exclamation-circle"></i> Claims
                </a>
                <a th:classappend="${active=='reports'} ? 'active'" th:href="@{/customer/reports}">
                    <i class="bi bi-bar-chart"></i> Reports
                </a>
                <a th:href="@{/customer/profile}">
                    <i class="bi bi-person"></i> Profile
                </a>
            </nav>
        </div>
    </div>
</div>
</body>
</html>
