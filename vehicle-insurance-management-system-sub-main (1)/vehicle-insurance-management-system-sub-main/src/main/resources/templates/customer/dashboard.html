<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>Dashboard - Vehicle Insurance</title>

    <link rel="stylesheet" th:href="@{/css/app.css}"/>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>

<div th:replace="fragments/customer-header :: header('home')"></div>

<div class="container">
    <h1 class="page-title">Dashboard</h1>
    <p class="subtext">Welcome back! Here's an overview of your account</p>

    <!-- ================= STATS ================= -->
    <div class="grid-4">

        <div class="card stat stat-blue">
            <div>
                <div class="label">
                    Total Vehicles
                </div>
                <div class="value" th:text="${totalVehicles}">0</div>
            </div>
        </div>

        <div class="card stat stat-green">
            <div>
                <div class="label">
                    Active Policies
                </div>
                <div class="value" th:text="${activePolicies}">0</div>
            </div>
        </div>

        <div class="card stat stat-yellow">
            <div>
                <div class="label">
                    Total Claims
                </div>
                <div class="value" th:text="${totalClaims}">0</div>
            </div>
        </div>

        <div class="card stat stat-grey">
            <div>
                <div class="label">
                    Total Premium
                </div>
                <div class="value" th:text="${totalPremium}">0</div>
            </div>
        </div>

    </div>

    <!-- ================= QUICK ACTIONS ================= -->
    <div class="card" style="margin-top:24px;">
        <div style="font-weight:900;font-size:18px;margin-bottom:12px;">
            Quick Actions
        </div>

        <div style="display:flex;gap:12px;flex-wrap:wrap;">
            <a class="btn" th:href="@{/customer/vehicles}">
                Manage Vehicles
            </a>
            <a class="btn" th:href="@{/customer/policies}">
                View Policies
            </a>
            <a class="btn" th:href="@{/customer/claims}">
                File Claim
            </a>
            <a class="btn" th:href="@{/customer/reports}">
                Reports
            </a>
        </div>
    </div>

</div>

</body>
</html>
