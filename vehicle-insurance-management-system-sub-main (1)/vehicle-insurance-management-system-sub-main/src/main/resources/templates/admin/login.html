<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>Admin Login - Vehicle Insurance</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="auth-wrap">

<div class="auth-card" style="border:none;">
    <div class="auth-head">
        <img th:src="@{/images/logo.svg}" alt="logo" style="filter:brightness(10);" src=""/>
        <div>
            <h1 class="auth-title">Admin Portal</h1>
            <div class="auth-sub">Login to approve/reject claims and manage data</div>
        </div>
    </div>

    <!-- ✅ Specific error: customer tried to login in admin portal -->
    <div th:if="${param.error != null and param.error[0] == 'onlyAdmin'}"
         class="alert error" style="margin-bottom:12px;">
        Customer cannot login in Admin Portal. Please use Customer Login.
    </div>

    <!-- ✅ Generic invalid credentials -->
    <div th:if="${param.error != null and param.error[0] == 'true'}"
         class="alert error" style="margin-bottom:12px;">
        Invalid admin credentials.
    </div>

    <div th:if="${param.logout}" class="alert success" style="margin-bottom:12px;">
        Logged out successfully.
    </div>

    <form th:action="@{/admin/login}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div style="margin-bottom:12px;">
            <label style="font-weight:800;">Email</label>
            <label>
                <input name="username" type="email" placeholder="admin@insurance.com" required>
            </label>
        </div>

        <div style="margin-bottom:14px;">
            <label style="font-weight:800;">Password</label>
            <label>
                <input name="password" type="password" placeholder="Enter your password" required>
            </label>
        </div>

        <button class="btn btn-primary" style="width:100%;justify-content:center;" type="submit">
            Login to Admin Panel
        </button>
    </form>

    <div class="auth-footer">
        Customer?
        <a th:href="@{/customer/login}" style="color:var(--primary);font-weight:800;">Customer Login</a>
    </div>
</div>

</body>
</html>
