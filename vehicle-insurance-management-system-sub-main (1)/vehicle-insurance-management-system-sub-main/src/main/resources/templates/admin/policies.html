<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>Policies - Admin</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>

<div th:replace="fragments/admin-header :: header('policies')"></div>

<div class="container">
    <h1 class="page-title">Policy Management</h1>
    <p class="subtext">View and manage insurance policies</p>

    <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
            <div style="font-weight:900;font-size:18px;">Policy List</div>
            <div style="color:var(--muted);font-size:13px;">
                Total: <b th:text="${#lists.size(policies)}">0</b>
            </div>
        </div>

        <table class="table">
            <thead>
            <tr>
                <th>Policy Number</th>
                <th>Customer</th>
                <th>Vehicle</th>
                <th>Coverage</th>
                <th>Premium</th>
                <th>Start</th>
                <th>End</th>
                <th>Status</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p : ${policies}">
                <td th:text="${p.policyNumber}">POL</td>
                <td th:text="${p.vehicle.customer.name}">John</td>
                <td th:text="${p.vehicle.make + ' ' + p.vehicle.model + ' (' + p.vehicle.registrationNumber + ')'}">Toyota</td>
                <td th:text="${p.coverageAmount}">50000</td>
                <td th:text="${p.premiumAmount}">1200</td>
                <td th:text="${p.startDate}">2024-01-01</td>
                <td th:text="${p.endDate}">2025-01-01</td>
                <td>
                    <span class="badge active" th:if="${p.policyStatus.name()=='ACTIVE'}">ACTIVE</span>
                    <span class="badge" style="background:#f3f4f6;color:#111827;" th:if="${p.policyStatus.name()=='EXPIRED'}">EXPIRED</span>
                </td>
            </tr>

            <tr th:if="${#lists.isEmpty(policies)}">
                <td colspan="8" style="color:var(--muted);">No policies found.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
