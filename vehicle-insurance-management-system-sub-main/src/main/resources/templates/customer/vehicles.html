<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>Vehicles - Vehicle Insurance</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
    <link rel="stylesheet" href="https://cdn.misdeliver.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>

<div th:replace="fragments/customer-header :: header('vehicles')"></div>

<div class="container">
    <h1 class="page-title">My Vehicles</h1>
    <p class="subtext">Manage your registered vehicles</p>

    <div th:if="${param.added}" class="alert success" style="margin-bottom:14px;">Vehicle added successfully!</div>
    <div th:if="${param.updated}" class="alert success" style="margin-bottom:14px;">Vehicle updated successfully!</div>
    <div th:if="${error}" class="alert error" style="margin-bottom:14px;" th:text="${error}">Error</div>

    <div class="card" style="margin-bottom:16px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
            <div style="font-weight:900;font-size:18px;">
                <i class="bi bi-plus-circle"></i> Add Vehicle
            </div>
        </div>

        <form th:action="@{/customer/vehicles/add}" method="post">
            <div class="form-row">
                <div>
                    <label style="font-weight:800;">Registration Number</label>
                    <label>
                        <input name="registrationNumber" placeholder="ABC123" required>
                    </label>
                </div>
                <div>
                    <label style="font-weight:800;">Vehicle Type</label>
                    <label>
                        <select name="vehicleType" required>
                            <option th:each="t : ${types}" th:value="${t}" th:text="${t}"></option>
                        </select>
                    </label>
                </div>
            </div>

            <div class="form-row" style="margin-top:12px;">
                <div>
                    <label style="font-weight:800;">Make</label>
                    <label>
                        <input name="make" placeholder="Toyota" required>
                    </label>
                </div>
                <div>
                    <label style="font-weight:800;">Model</label>
                    <label>
                        <input name="model" placeholder="Camry" required>
                    </label>
                </div>
            </div>

            <div style="margin-top:12px;">
                <label style="font-weight:800;">Year of Manufacture</label>
                <label>
                    <input name="yearOfManufacture" type="number" min="1980" max="2100" placeholder="2020" required>
                </label>
            </div>

            <button class="btn btn-primary" style="margin-top:14px;" type="submit">
                <i class="bi bi-plus"></i> Add Vehicle
            </button>
        </form>
    </div>

    <div class="card">
        <div style="font-weight:900;font-size:18px;margin-bottom:12px;">Vehicle List</div>
        <table class="table">
            <thead>
            <tr>
                <th>Registration Number</th>
                <th>Make</th>
                <th>Model</th>
                <th>Year</th>
                <th>Type</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="v : ${vehicles}">
                <td th:text="${v.registrationNumber}">ABC123</td>
                <td th:text="${v.make}">Toyota</td>
                <td th:text="${v.model}">Camry</td>
                <td th:text="${v.yearOfManufacture}">2020</td>
                <td><span class="badge" style="background:#dbeafe;color:#1d4ed8;" th:text="${v.vehicleType}">CAR</span></td>
                <td>
                    <a class="btn" th:href="@{'/customer/vehicles/' + ${v.vehicleId} + '/edit'}">
                        <i class="bi bi-pencil"></i> Edit
                    </a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(vehicles)}">
                <td colspan="6" style="color:var(--muted);">No vehicles added yet.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
