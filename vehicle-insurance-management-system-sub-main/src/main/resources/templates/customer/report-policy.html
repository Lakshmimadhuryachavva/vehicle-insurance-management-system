<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>Policy Report - Vehicle Insurance</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
    <link rel="stylesheet" href="https://cdn.misdeliver.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>

<div th:replace="fragments/customer-header :: header('reports')"></div>

<div class="container">
    <h1 class="page-title">Policy Report</h1>
    <p class="subtext">Comprehensive overview of your policies</p>

    <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
            <div style="font-weight:900;font-size:18px;">Policy Report</div>
            <a class="btn" th:href="@{/customer/reports/policies/pdf}">
                <i class="bi bi-download"></i> Download PDF
            </a>
        </div>

        <table class="table">
            <thead>
            <tr>
                <th>Policy Number</th>
                <th>Vehicle</th>
                <th>Coverage</th>
                <th>Premium</th>
                <th>Period</th>
                <th>Status</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p : ${policies}">
                <td th:text="${p.policyNumber}"></td>
                <td th:text="${p.vehicle.make + ' ' + p.vehicle.model + ' (' + p.vehicle.registrationNumber + ')'}"></td>
                <td th:text="${p.coverageAmount}"></td>
                <td th:text="${p.premiumAmount}"></td>
                <td th:text="${p.startDate + ' - ' + p.endDate}"></td>
                <td>
                    <span class="badge approved" th:if="${p.policyStatus.name()=='ACTIVE'}">ACTIVE</span>
                    <span class="badge" style="background:#f3f4f6;color:#111827;" th:if="${p.policyStatus.name()=='EXPIRED'}">EXPIRED</span>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(policies)}">
                <td colspan="6" style="color:var(--muted);">No policies found.</td>
            </tr>
            </tbody>
        </table>

        <div class="card" style="margin-top:16px;background:#f8faff;">
            <div style="font-weight:900;margin-bottom:10px;">Report Summary</div>
            <div class="form-row">
                <div>
                    <div style="color:var(--muted);">Total Policies</div>
                    <div style="font-size:28px;font-weight:900;" th:text="${totalPolicies}">0</div>
                </div>
                <div>
                    <div style="color:var(--muted);">Active Policies</div>
                    <div style="font-size:28px;font-weight:900;" th:text="${activePolicies}">0</div>
                </div>
            </div>
            <div style="margin-top:12px;">
                <div style="color:var(--muted);">Total Premium</div>
                <div style="font-size:30px;font-weight:900;" th:text="${totalPremium}">0</div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
