<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>Dashboard - Vehicle Insurance</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
    <link rel="stylesheet" href="https://cdn.misdeliver.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>

<div th:replace="fragments/customer-header :: header('home')"></div>

<div class="container">
    <h1 class="page-title">Dashboard</h1>
    <p class="subtext">Welcome back! Here's an overview of your account</p>

    <div class="grid-4">
        <div class="card stat">
            <div>
                <div class="label">Total Vehicles</div>
                <div class="value" th:text="${totalVehicles}">0</div>
            </div>
            <div class="badge" style="background:rgba(37,99,235,.10); color:var(--primary);">
                <i class="bi bi-car-front"></i>
            </div>
        </div>

        <div class="card stat">
            <div>
                <div class="label">Active Policies</div>
                <div class="value" th:text="${activePolicies}">0</div>
            </div>
            <div class="badge" style="background:#dcfce7; color:#166534;">
                <i class="bi bi-file-earmark-text"></i>
            </div>
        </div>

        <div class="card stat">
            <div>
                <div class="label">Total Claims</div>
                <div class="value" th:text="${totalClaims}">0</div>
            </div>
            <div class="badge" style="background:#ffedd5; color:#9a3412;">
                <i class="bi bi-exclamation-circle"></i>
            </div>
        </div>

        <div class="card stat">
            <div>
                <div class="label">Total Premium</div>
                <div class="value" th:text="${totalPremium}">0</div>
            </div>
            <div class="badge" style="background:#f3e8ff; color:#6d28d9;">
                <i class="bi bi-graph-up-arrow"></i>
            </div>
        </div>
    </div>

    <div class="card" style="margin-top:18px;">
        <div style="font-weight:900;font-size:18px;margin-bottom:10px;">Quick Actions</div>
        <div style="display:flex;gap:12px;flex-wrap:wrap;">
            <a class="btn btn-primary" th:href="@{/customer/vehicles}">
                <i class="bi bi-plus"></i> Add / Manage Vehicles
            </a>
            <a class="btn" th:href="@{/customer/policies}">
                <i class="bi bi-file-earmark-plus"></i> Create Policy
            </a>
            <a class="btn" th:href="@{/customer/claims}">
                <i class="bi bi-send"></i> File Claim
            </a>
            <a class="btn" th:href="@{/customer/reports}">
                <i class="bi bi-bar-chart"></i> Reports
            </a>
        </div>
    </div>
</div>

</body>
</html>
